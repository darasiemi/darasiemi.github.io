<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="hta-title hta-desc" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <title id="hta-title">Huawei Tech Arena — LLM inference architecture</title>
  <desc id="hta-desc">Model box in the center with Latency levers above, Accuracy levers below, Prompt and Questions on the right, Decoding on the left, and Output Answers on the far left.</desc>

  <defs>
    <marker id="hta-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4b5563" />
    </marker>
    <filter id="hta-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1400" height="760" fill="#f8f9fc" />

  <!-- Latency -->
  <g filter="url(#hta-shadow)">
    <rect x="485" y="40" width="520" height="200" rx="14" fill="#ffffff" stroke="#a94466" stroke-width="2.5" />
    <text x="515" y="80" font-size="26" font-weight="700" fill="#111827">Latency</text>
    <line x1="515" y1="92" x2="607" y2="92" stroke="#e8a92a" stroke-width="4" stroke-linecap="round" />
    <g font-size="17" fill="#374151">
      <text x="515" y="122">• GPU vs CPU — greatest jump</text>
      <text x="515" y="148">• Batching</text>
      <text x="515" y="174">• Speculative decoding</text>
      <text x="515" y="200">• Model compression (quantization)</text>
      <text x="515" y="226">• Virtualized LLM (paged attention)</text>
    </g>
  </g>

  <!-- Model (center column reference x=490..1000, center x=745) -->
  <g filter="url(#hta-shadow)">
    <rect x="490" y="290" width="510" height="200" rx="14" fill="#ffffff" stroke="#3b8c6f" stroke-width="2.5" />
    <text x="520" y="330" font-size="26" font-weight="700" fill="#111827">Model</text>
    <line x1="520" y1="342" x2="596" y2="342" stroke="#4877e5" stroke-width="4" stroke-linecap="round" />
    <g font-size="17" fill="#374151">
      <text x="520" y="372">• Qwen3 (0.6B → 1.7B → 4B)</text>
      <text x="520" y="398">• Llama 2.2 3B</text>
      <text x="520" y="424">• Gemma (1B → 4B)</text>
      <text x="520" y="450">• Gemma-3-270m-it</text>
    </g>
  </g>

  <!-- Accuracy -->
  <g filter="url(#hta-shadow)">
    <rect x="485" y="540" width="520" height="190" rx="14" fill="#ffffff" stroke="#d99632" stroke-width="2.5" />
    <text x="515" y="580" font-size="26" font-weight="700" fill="#111827">Accuracy</text>
    <line x1="515" y1="592" x2="611" y2="592" stroke="#9fc93a" stroke-width="4" stroke-linecap="round" />
    <g font-size="17" fill="#374151">
      <text x="515" y="622">• Subject-specific prompts</text>
      <text x="515" y="648">• Chain-of-thought</text>
      <text x="515" y="674">• Apply Chat template (specific to Qwen3)</text>
    </g>
  </g>

  <!-- Prompt + Questions -->
  <g filter="url(#hta-shadow)">
    <rect x="1060" y="330" width="260" height="120" rx="14" fill="#ffffff" stroke="#4877e5" stroke-width="2.5" />
    <text x="1190" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Prompt +</text>
    <text x="1190" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Questions</text>
  </g>

  <!-- Decoding -->
  <g filter="url(#hta-shadow)">
    <rect x="200" y="305" width="230" height="170" rx="14" fill="#ffffff" stroke="#43869b" stroke-width="2.5" />
    <g font-size="17" fill="#374151">
      <text x="222" y="348">• Deterministic Decoding</text>
      <text x="222" y="378">• Max_Tokens</text>
      <text x="222" y="408">• Post-processing</text>
    </g>
  </g>

  <!-- Output Answers -->
  <g filter="url(#hta-shadow)">
    <rect x="20" y="325" width="130" height="130" rx="14" fill="#ffffff" stroke="#86c37e" stroke-width="2.5" />
    <text x="85" y="385" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Output</text>
    <text x="85" y="413" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Answers</text>
  </g>

  <!-- Flow arrows (thick lines, solid heads, ~55px runs) -->
  <!-- Prompt (x=1060) → Model (right edge x=1000) -->
  <line x1="1060" y1="390" x2="1005" y2="390" stroke="#4b5563" stroke-width="3.5" marker-end="url(#hta-arrow)" />
  <!-- Model (left edge x=490) → Decoding (right edge x=430) -->
  <line x1="490" y1="390" x2="435" y2="390" stroke="#4b5563" stroke-width="3.5" marker-end="url(#hta-arrow)" />
  <!-- Decoding (left edge x=200) → Output (right edge x=150) -->
  <line x1="200" y1="390" x2="155" y2="390" stroke="#4b5563" stroke-width="3.5" marker-end="url(#hta-arrow)" />
  <!-- Latency (bottom y=240) → Model (top y=290), center x=745 -->
  <line x1="745" y1="243" x2="745" y2="285" stroke="#4b5563" stroke-width="3.5" marker-end="url(#hta-arrow)" />
  <!-- Accuracy (top y=540) → Model (bottom y=490), center x=745 -->
  <line x1="745" y1="537" x2="745" y2="495" stroke="#4b5563" stroke-width="3.5" marker-end="url(#hta-arrow)" />
</svg>
