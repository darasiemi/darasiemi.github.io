<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" role="img" aria-labelledby="ta-title ta-desc" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <title id="ta-title">Tus-Aite — AI agent architecture for the Tech Ireland National AI Challenge 2026</title>
  <desc id="ta-desc">A waiting list of synthetic Irish outpatient referrals feeds an AI agent that runs an urgency tool, a capacity tool, a coordinator tool, a ranked list stored with evidence in a knowledge graph, and a rationale tool. The clinician receives each position with its plain-language justification and can accept or override.</desc>

  <defs>
    <marker id="ta-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4b5563" />
    </marker>
    <filter id="ta-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1400" height="460" fill="#f8f9fc" />

  <!-- Waiting list -->
  <g>
    <rect filter="url(#ta-shadow)" x="20" y="20" width="250" height="420" rx="14" fill="#ffffff" stroke="#0c7489" stroke-width="2.5" />
    <text x="40" y="70" font-size="24" font-weight="700" fill="#0c7489">Waiting list</text>
    <g font-size="15" fill="#374151">
      <text x="40" y="110">Synthetic Irish outpatient</text>
      <text x="40" y="132">referrals, already sorted</text>
      <text x="40" y="180" font-size="15" font-weight="600" fill="#111827">Urgent · Semi-Urgent · Routine</text>
      <text x="40" y="240">NTPF national structure;</text>
      <text x="40" y="262">clinical detail and capacity</text>
      <text x="40" y="284">invented</text>
    </g>
  </g>

  <!-- AI AGENT container -->
  <g>
    <rect filter="url(#ta-shadow)" x="295" y="20" width="790" height="420" rx="16" fill="#ffffff" stroke="#d9802b" stroke-width="2.5" />
    <text x="315" y="55" font-size="22" font-weight="700" fill="#d9802b" letter-spacing="0.5">AI AGENT · RUNS THE TOOLS</text>
  </g>

  <!-- Urgency tool -->
  <g>
    <rect filter="url(#ta-shadow)" x="325" y="85" width="160" height="160" rx="10" fill="#ffffff" stroke="#0c7489" stroke-width="2" />
    <text x="340" y="115" font-size="16" font-weight="700" fill="#111827">Urgency tool</text>
    <g font-size="14" fill="#374151">
      <text x="340" y="148">NEWS2 from latest</text>
      <text x="340" y="167">vital signs</text>
    </g>
  </g>

  <!-- Capacity tool -->
  <g>
    <rect filter="url(#ta-shadow)" x="325" y="265" width="160" height="160" rx="10" fill="#ffffff" stroke="#0c7489" stroke-width="2" />
    <text x="340" y="295" font-size="16" font-weight="700" fill="#111827">Capacity tool</text>
    <g font-size="14" fill="#374151">
      <text x="340" y="328">Ward and clinic</text>
      <text x="340" y="347">pressure</text>
    </g>
  </g>

  <!-- Coordinator tool -->
  <g>
    <rect filter="url(#ta-shadow)" x="520" y="130" width="140" height="230" rx="10" fill="#ffffff" stroke="#0c7489" stroke-width="2" />
    <text x="533" y="162" font-size="16" font-weight="700" fill="#111827">Coordinator</text>
    <text x="533" y="181" font-size="16" font-weight="700" fill="#111827">tool</text>
    <g font-size="14" fill="#374151">
      <text x="533" y="213">Combines both</text>
      <text x="533" y="232">scores, ranks</text>
      <text x="533" y="251">within each</text>
      <text x="533" y="270">category, checks</text>
      <text x="533" y="289">5 NTPF rules</text>
    </g>
  </g>

  <!-- Ranked list (orange highlight) -->
  <g>
    <rect filter="url(#ta-shadow)" x="695" y="130" width="180" height="230" rx="10" fill="#fff2e0" stroke="#d9802b" stroke-width="2.5" />
    <text x="710" y="162" font-size="16" font-weight="700" fill="#111827">Ranked list</text>
    <g font-size="14" fill="#374151">
      <text x="710" y="206">Saved with its</text>
      <text x="710" y="225">evidence in the</text>
      <text x="710" y="244">knowledge graph</text>
    </g>
  </g>

  <!-- Rationale tool -->
  <g>
    <rect filter="url(#ta-shadow)" x="905" y="130" width="170" height="230" rx="10" fill="#ffffff" stroke="#0c7489" stroke-width="2" />
    <text x="920" y="162" font-size="16" font-weight="700" fill="#111827">Rationale tool</text>
    <g font-size="14" fill="#374151">
      <text x="920" y="206">Explains each</text>
      <text x="920" y="225">position from</text>
      <text x="920" y="244">cited evidence</text>
    </g>
  </g>

  <!-- Clinician -->
  <g>
    <rect filter="url(#ta-shadow)" x="1115" y="20" width="265" height="420" rx="14" fill="#ffffff" stroke="#0c7489" stroke-width="2.5" />
    <text x="1135" y="70" font-size="24" font-weight="700" fill="#0c7489">Clinician</text>
    <g font-size="15" fill="#374151">
      <text x="1135" y="115">Sees each position</text>
      <text x="1135" y="137">and its plain-language</text>
      <text x="1135" y="159">why</text>
      <text x="1135" y="210" font-weight="600" fill="#111827">Accepts or overrides</text>
    </g>
  </g>

  <!-- Flow arrows -->
  <!-- Waiting → Urgency -->
  <line x1="270" y1="165" x2="320" y2="165" stroke="#4b5563" stroke-width="3" marker-end="url(#ta-arrow)" />
  <!-- Waiting → Capacity -->
  <line x1="270" y1="345" x2="320" y2="345" stroke="#4b5563" stroke-width="3" marker-end="url(#ta-arrow)" />
  <!-- Urgency → Coordinator -->
  <line x1="485" y1="165" x2="515" y2="165" stroke="#4b5563" stroke-width="3" marker-end="url(#ta-arrow)" />
  <!-- Capacity → Coordinator -->
  <line x1="485" y1="345" x2="515" y2="345" stroke="#4b5563" stroke-width="3" marker-end="url(#ta-arrow)" />
  <!-- Coordinator → Ranked list -->
  <line x1="660" y1="245" x2="690" y2="245" stroke="#4b5563" stroke-width="3" marker-end="url(#ta-arrow)" />
  <!-- Ranked list → Rationale -->
  <line x1="875" y1="245" x2="900" y2="245" stroke="#4b5563" stroke-width="3" marker-end="url(#ta-arrow)" />
  <!-- Rationale → Clinician -->
  <line x1="1075" y1="245" x2="1110" y2="245" stroke="#4b5563" stroke-width="3" marker-end="url(#ta-arrow)" />
</svg>
