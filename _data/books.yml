# ──────────────────────────────────────────────────────────────────────────────
# Bookshelf — the books that shape how I think.
#
# Each entry becomes a book in the WebGL shelf on /bookshelf/. The detail panel
# shows a local digital cover from `preview_cover` or Open Library via `isbn`, plus
# the `cover` field — my own photo of the physical copy on my desk.
#
# Fields:
#   title        — book title
#   author       — single author or "Co-Author A & Co-Author B"
#   isbn         — ISBN-13 for the Open Library preview when no local digital
#                  cover is set. The visible shelf spines are drawn separately.
#   preview_cover — local digital cover for fast, reliable previews.
#   cover        — path to my personal photo of the book
#                  (assets/img/books/…). Used only in the “My copy” section.
#   spine_color  — hex, drives the gradient card shown while a preview is
#                  loading or when no preview is available.
#   text_color   — hex for the title/author text on the gradient card.
#   progress     — int 0–100. Only read for `currently_reading`.
#   year         — publication year, shown on the detail card.
#
# `last_updated` is shown on /bookshelf/. Bump it whenever the shelf changes
# (new book, progress update, cover swap). Format: YYYY-MM-DD.
# ──────────────────────────────────────────────────────────────────────────────
