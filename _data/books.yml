# ──────────────────────────────────────────────────────────────────────────────
# Bookshelf — the books that shape how I think.
#
# Each entry becomes a plane in the WebGL shelf on /bookshelf/. The shelf uses
# the canonical cover (fetched from Open Library via `isbn`) so the row looks
# polished and uniform. Clicking a book opens a detail panel that shows the
# `cover` field — my own photo of the physical copy on my desk.
#
# Fields:
#   title        — book title
#   author       — single author or "Co-Author A & Co-Author B"
#   isbn         — ISBN-13 for the Open Library front-cover preview in the
#                  detail card. The visible shelf spines are drawn separately.
#   cover        — path to my personal photo of the book
#                  (assets/img/books/…). Used only in the “My copy” section.
#   spine_color  — hex, drives the gradient card shown while a texture is
#                  loading or when both sources fail.
#   text_color   — hex for the title/author text on the gradient card.
#   progress     — int 0–100. Only read for `currently_reading`.
#   year         — publication year, shown on the detail card.
# ──────────────────────────────────────────────────────────────────────────────
currently_reading:
